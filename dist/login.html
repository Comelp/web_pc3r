<!DOCTYPE html>
<html>
    <body style="font-family: sans-serif;">

        <div id="login-box" style="
            width: 320px;
            margin: 80px auto;
            padding: 20px;
            background-color: #e6e6e6;
            border: 2px solid black;
            border-radius: 8px;
        ">

            <form id="login-form" style="display: flex; flex-direction: column; gap: 10px;">
                <input name="username" placeholder="username" style="padding: 8px;">
                <input type="password" name="password" placeholder="password" style="padding: 8px;">

                <input type="color"
                       name="couleur"
                       id="color-input"
                       value="green"
                       style="display:none; width: 100%; height: 40px; border: none;">

                <button type="submit" id="submit-btn" style="padding: 10px;">
                    Se connecter
                </button>
            </form>

            <button onclick="swapMod()" id="swap-btn" style="
                margin-top: 10px;
                width: 100%;
                padding: 8px;
            ">
                Créer un compte
            </button>

            <div id="error" style="color:red; margin-top: 10px;"></div>

        </div>

        <script>
        let isRegister = false;

        function swapMod() {
            isRegister = !isRegister;

            const form = document.getElementById('login-form');
            const btn = document.getElementById('submit-btn');
            const color = document.getElementById('color-input');
            const swap = document.getElementById('swap-btn');
            const error = document.getElementById('error');

            error.innerText = "";

            if (isRegister) {
                form.dataset.action = '/register';
                btn.innerText = 'Créer le compte';
                color.style.display = 'block';
                swap.innerText = "J'ai déjà un compte";
            } else {
                form.dataset.action = '/login';
                btn.innerText = 'Se connecter';
                color.style.display = 'none';
                swap.innerText = "Créer un compte";
            }
        }

        document.getElementById('login-form').dataset.action = '/login';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const error = document.getElementById('error');

            error.innerText = "";

            const formData = new FormData(form);

            try {
                const res = await fetch(form.dataset.action, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                if (!res.ok) {
                    const text = await res.text();
                    error.innerText = text;
                    return;
                }

                window.location.href = "/";
            } catch (err) {
                error.innerText = "Erreur serveur";
            }
        });

        fetch('/me', { credentials: 'include' })
            .then(res => {
                if (!res.ok) throw new Error();
                return res.json();
            })
            .then(data => {
                document.getElementById('login-box').innerHTML =
                    "<p>Déjà connecté : " + data.username + "</p>";
            })
            .catch(() => {});
        </script>

    </body>
</html>
